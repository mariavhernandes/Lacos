name: app

description: "Laços"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^4.11.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/logos/
    - assets/icons/
    - assets/icons/navigation/
    - assets/images/
    - assets/images/commun/
    - assets/images/elderly/
    - assets/images/family/
    - assets/avatars/
    - assets/icons/icons_footer/
    - assets/icons/notifications/

    - assets/Lugares/Americana/Cafeterias/
    - assets/Lugares/Americana/Lazer/
    - assets/Lugares/Americana/Restaurantes/

    - assets/Lugares/Campinas/Cafeterias/
    - assets/Lugares/Campinas/Lazer/
    - assets/Lugares/Campinas/Restaurantes/

    - assets/Lugares/Limeira/Cafeterias/
    - assets/Lugares/Limeira/Lazer/
    - assets/Lugares/Limeira/Restaurantes/

    - assets/Lugares/SantaBarbara/Cafeterias/
    - assets/Lugares/SantaBarbara/Lazer/
    - assets/Lugares/SantaBarbara/Restaurantes/

    - assets/Lugares/Sumare/Cafeterias/
    - assets/Lugares/Sumare/Lazer/
    - assets/Lugares/Sumare/Restaurantes/

  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700

    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Regular.ttf
          weight: 400
        - asset: assets/fonts/Raleway-Medium.ttf
          weight: 500
        - asset: assets/fonts/Raleway-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Raleway-Bold.ttf
          weight: 700