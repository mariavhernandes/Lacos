services:

  firebase-emulators:

    image: node:18-alpine

    container_name: lacos-firebase-emulators

    ports:
      - "4000:4000"
      - "9099:9099"
      - "8080:8080"

    environment:
      - GCP_PROJECT=lacos-dev

    working_dir: /app

    volumes:
      - .:/app

    command: >
      sh -c "if ! command -v firebase > /dev/null; then
               apk add --no-cache openjdk11-jre && npm install -g firebase-tools;
             fi &&
             firebase emulators:start --only auth,firestore --project lacos-dev"

    restart: unless-stopped


  backend:

    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: lacos-backend

    ports:
      - "3000:80"

    volumes:
      - ./backend:/var/www/html
      - ./backend/uploads:/var/www/html/uploads

    restart: unless-stopped